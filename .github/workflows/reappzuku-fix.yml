name: Build ReAppzuku Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: reappzuku-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'gree1d/ReAppzuku'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run foreground detection regression tests
        run: sh tools/run-foreground-tests.sh

      - name: Install Android SDK packages
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;35.0.0'

      - name: Prepare signing key
        env:
          REAPP_FIX_KEYSTORE_BASE64: ${{ secrets.REAPPZUKU_FIX_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$REAPP_FIX_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$REAPP_FIX_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null
            echo 'Signing: persistent key supplied by repository owner.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::No persistent signing key configured. This test APK uses a new key for this run; subsequent builds may require uninstalling this Fix variant before installation.'
            echo 'Signing: temporary test key. Configure REAPPZUKU_FIX_KEYSTORE_BASE64 for future updates with the same signature.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the fixed variant
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -Dorg.gradle.internal.http.connectionTimeout=30000 \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            :app:assembleFixed

      - name: Verify APK and prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/fixed/app-fixed.apk dist/ReAppzuku-Fix-1.8.7.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/ReAppzuku-Fix-1.8.7.apk | tee dist/signing-certificate.txt
          cd dist
          sha256sum ReAppzuku-Fix-1.8.7.apk > ReAppzuku-Fix-1.8.7.apk.sha256
          printf 'Source commit: %s\n' "$GITHUB_SHA" > build-info.txt
          printf 'Variant: fixed\nApplication ID: com.gree1d.reappzuku.fixed\n' >> build-info.txt
          printf 'Install alongside the original app. Device testing is still required.\n' >> build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ReAppzuku-Fix-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
